<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradTeaser" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="100%" stop-color="#ffe3ea"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bgGradTeaser)"/>

  <!-- High Wagging Tail -->
  <path d="M 250,230 C 350,190 380,80 300,50 C 260,35 240,110 230,190 Z" fill="#f8f9fa" stroke="#ffccd5" stroke-width="3"/>
  <circle cx="320" cy="65" r="8" fill="#ffd166"/>

  <!-- Kimono Body Dancing Tilt -->
  <g transform="rotate(-5 200 250)">
    <path d="M 140,260 L 260,260 L 280,380 L 120,380 Z" fill="#7209b7"/>
    <path d="M 170,260 L 200,310 L 230,260" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="135" y="320" width="130" height="24" fill="#f72585" rx="6"/>
  </g>

  <!-- Head -->
  <rect x="185" y="225" width="30" height="35" fill="#ffdfd3"/>
  <ellipse cx="200" cy="175" rx="66" ry="60" fill="#ffdfd3"/>

  <!-- Perky Fox Ears with Movement Lines -->
  <polygon points="145,135 110,50 170,100" fill="#f8f9fa" stroke="#dee2e6" stroke-width="3"/>
  <polygon points="142,125 120,65 160,102" fill="#ff758f"/>
  
  <polygon points="255,135 290,50 230,100" fill="#f8f9fa" stroke="#dee2e6" stroke-width="3"/>
  <polygon points="258,125 280,65 240,102" fill="#ff758f"/>

  <!-- Silver Hair -->
  <path d="M 135,165 C 130,115 160,105 200,105 C 240,105 270,115 265,165 C 265,180 260,200 255,210 C 245,165 230,145 200,145 C 170,145 155,165 145,210 C 140,200 135,180 135,165 Z" fill="#f8f9fa"/>

  <!-- Winking Face -->
  <ellipse cx="172" cy="175" rx="11" ry="14" fill="#7209b7"/>
  <circle cx="168" cy="170" r="5" fill="#ffffff"/>
  <circle cx="176" cy="180" r="2.5" fill="#ffffff"/>
  <path d="M 158,162 Q 172,156 186,164" stroke="#240046" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Winking Right Eye -->
  <path d="M 215,178 Q 228,165 242,178" stroke="#240046" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- Happy Open Smile with Little Fang -->
  <path d="M 188,198 Q 200,218 212,198 Z" fill="#d90429"/>
  <polygon points="194,198 198,204 201,198" fill="#ffffff"/>

  <!-- Cheerful Rosy Cheeks -->
  <circle cx="155" cy="192" r="12" fill="#ff4d6d" opacity="0.5"/>
  <circle cx="245" cy="192" r="12" fill="#ff4d6d" opacity="0.5"/>

  <!-- Sparkles -->
  <text x="80" y="120" font-size="28">✨</text>
  <text x="310" y="180" font-size="28">💖</text>

  <!-- Banner -->
  <rect x="90" y="350" width="220" height="32" rx="16" fill="#ff4d6d"/>
  <text x="200" y="372" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">✨ "Wanna see your gift?" ✨</text>
</svg>
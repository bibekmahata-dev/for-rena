<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradBalloon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9fb"/>
      <stop offset="100%" stop-color="#ffe5ec"/>
    </radialGradient>
    <linearGradient id="balloonGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758f"/>
      <stop offset="100%" stop-color="#d90429"/>
    </linearGradient>
    <linearGradient id="balloonGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5179e"/>
      <stop offset="100%" stop-color="#7209b7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bgGradBalloon)"/>

  <!-- Balloon Strings -->
  <path d="M 140,90 Q 180,180 210,250" stroke="#adb5bd" stroke-width="2" fill="none"/>
  <path d="M 260,80 Q 230,170 210,250" stroke="#adb5bd" stroke-width="2" fill="none"/>
  <path d="M 200,60 Q 200,160 210,250" stroke="#adb5bd" stroke-width="2" fill="none"/>

  <!-- Heart Balloons -->
  <g transform="translate(100, 30) scale(0.7)">
    <path d="M 50,85 A 30,30 0 0,1 10,40 A 22,22 0 0,1 50,22 A 22,22 0 0,1 90,40 A 30,30 0 0,1 50,85 Z" fill="url(#balloonGrad1)"/>
    <ellipse cx="35" cy="35" rx="8" ry="4" fill="#ffffff" opacity="0.6" transform="rotate(-30 35 35)"/>
  </g>

  <g transform="translate(220, 20) scale(0.65)">
    <path d="M 50,85 A 30,30 0 0,1 10,40 A 22,22 0 0,1 50,22 A 22,22 0 0,1 90,40 A 30,30 0 0,1 50,85 Z" fill="url(#balloonGrad2)"/>
    <ellipse cx="35" cy="35" rx="8" ry="4" fill="#ffffff" opacity="0.6" transform="rotate(-30 35 35)"/>
  </g>

  <g transform="translate(160, 5) scale(0.8)">
    <path d="M 50,85 A 30,30 0 0,1 10,40 A 22,22 0 0,1 50,22 A 22,22 0 0,1 90,40 A 30,30 0 0,1 50,85 Z" fill="#ff477e"/>
    <ellipse cx="35" cy="35" rx="8" ry="4" fill="#ffffff" opacity="0.6" transform="rotate(-30 35 35)"/>
  </g>

  <!-- Chibi Tomoe floating -->
  <ellipse cx="210" cy="290" rx="45" ry="50" fill="#3a0ca3"/>
  <rect x="175" y="290" width="70" height="16" fill="#f72585" rx="4"/>
  <circle cx="210" cy="210" r="50" fill="#ffdfd3"/>

  <!-- Fox Ears -->
  <polygon points="170,180 140,110 190,150" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  <polygon points="168,170 148,125 182,152" fill="#ff758f"/>
  <polygon points="250,180 280,110 230,150" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  <polygon points="252,170 272,125 238,152" fill="#ff758f"/>

  <!-- Silver Hair -->
  <path d="M 160,200 C 155,160 180,150 210,150 C 240,150 265,160 260,200 C 245,180 235,170 210,170 C 185,170 175,180 160,200 Z" fill="#f8f9fa"/>

  <!-- Joyful Eyes -->
  <path d="M 185,205 Q 195,195 205,205" stroke="#240046" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 215,205 Q 225,195 235,205" stroke="#240046" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Cute Mouth -->
  <path d="M 205,218 Q 210,214 210,220 Q 210,214 215,218" stroke="#c9184a" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Big Blush -->
  <circle cx="180" cy="218" r="9" fill="#ff4d6d" opacity="0.55"/>
  <circle cx="240" cy="218" r="9" fill="#ff4d6d" opacity="0.55"/>

  <!-- Party Hat -->
  <polygon points="210,120 195,155 225,155" fill="#ffd166" stroke="#f77f00" stroke-width="2"/>
  <circle cx="210" cy="118" r="5" fill="#ff006e"/>

  <!-- Banner -->
  <rect x="90" y="350" width="220" height="32" rx="16" fill="#7209b7"/>
  <text x="200" y="372" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">"Happy Birthday, cutie!" 🎂</text>
</svg>
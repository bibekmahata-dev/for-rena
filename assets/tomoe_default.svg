<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="100%" stop-color="#f8d7e3"/>
    </radialGradient>
    <radialGradient id="foxfire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a2d2ff"/>
      <stop offset="40%" stop-color="#72efdd"/>
      <stop offset="100%" stop-color="#72efdd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kimono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a0ca3"/>
      <stop offset="100%" stop-color="#240046"/>
    </linearGradient>
    <linearGradient id="fanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f77f00"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Floating Fox Fire (Kitsunebi) -->
  <circle cx="80" cy="140" r="35" fill="url(#foxfire)"/>
  <circle cx="80" cy="140" r="12" fill="#ffffff" opacity="0.8"/>
  <circle cx="320" cy="220" r="25" fill="url(#foxfire)"/>

  <!-- Fluffy Fox Tail -->
  <path d="M 260,260 C 340,240 370,160 320,120 C 290,100 270,160 250,220 Z" fill="#f8f9fa" stroke="#dee2e6" stroke-width="3"/>
  <path d="M 320,120 C 310,135 295,145 285,150 C 300,130 310,120 320,120 Z" fill="#e9ecef"/>

  <!-- Kimono Body -->
  <path d="M 140,260 L 260,260 L 280,380 L 120,380 Z" fill="url(#kimono)"/>
  <!-- Kimono Collar / Trim -->
  <path d="M 170,260 L 200,310 L 230,260" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Purple Obi / Sash -->
  <rect x="135" y="320" width="130" height="24" fill="#9d4edd" rx="6"/>
  <circle cx="200" cy="332" r="6" fill="#ffd166"/>

  <!-- Neck -->
  <rect x="185" y="230" width="30" height="35" fill="#ffdfd3"/>

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="65" ry="60" fill="#ffdfd3"/>

  <!-- Fox Ears -->
  <polygon points="145,140 120,60 175,105" fill="#f8f9fa" stroke="#dee2e6" stroke-width="3"/>
  <polygon points="142,130 130,75 165,108" fill="#ffb7c5"/>
  
  <polygon points="255,140 280,60 225,105" fill="#f8f9fa" stroke="#dee2e6" stroke-width="3"/>
  <polygon points="258,130 270,75 235,108" fill="#ffb7c5"/>

  <!-- Silver / White Hair -->
  <path d="M 135,170 C 130,120 160,110 200,110 C 240,110 270,120 265,170 C 265,185 260,205 255,215 C 245,170 230,150 200,150 C 170,150 155,170 145,215 C 140,205 135,185 135,170 Z" fill="#f8f9fa"/>
  <!-- Hair bangs strands -->
  <path d="M 180,145 L 185,185 L 195,150 L 205,185 L 215,145" stroke="#f8f9fa" stroke-width="6" fill="#f8f9fa" stroke-linecap="round"/>

  <!-- Eyes (Purple Kitsune Slanted Anime Eyes) -->
  <ellipse cx="175" cy="180" rx="9" ry="12" fill="#5a189a"/>
  <circle cx="172" cy="176" r="4" fill="#ffffff"/>
  <path d="M 160,168 Q 175,164 188,170" stroke="#240046" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <ellipse cx="225" cy="180" rx="9" ry="12" fill="#5a189a"/>
  <circle cx="222" cy="176" r="4" fill="#ffffff"/>
  <path d="M 212,170 Q 225,164 240,168" stroke="#240046" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Tsundere Smirk -->
  <path d="M 195,205 Q 200,210 208,206" stroke="#9d0208" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Soft Blush -->
  <circle cx="162" cy="195" r="8" fill="#ff758f" opacity="0.4"/>
  <circle cx="238" cy="195" r="8" fill="#ff758f" opacity="0.4"/>

  <!-- Folding Fan (Sensu) in Hand -->
  <path d="M 220,290 L 270,220 A 45,45 0 0,1 310,270 Z" fill="url(#fanGrad)" stroke="#d48b0a" stroke-width="2"/>
  <path d="M 220,290 L 270,220 M 220,290 L 290,240 M 220,290 L 310,270" stroke="#b07d10" stroke-width="1.5"/>
  <!-- Fan Cherry Blossom Emblem -->
  <circle cx="270" cy="250" r="6" fill="#ffffff" opacity="0.9"/>

  <!-- Character Banner Tag -->
  <rect x="90" y="350" width="220" height="32" rx="16" fill="#ffffff" stroke="#ffccd5" stroke-width="2"/>
  <text x="200" y="372" font-family="sans-serif" font-weight="bold" font-size="14" fill="#5a189a" text-anchor="middle">✨ Shrine Familiar: Tomoe ✨</text>
</svg>